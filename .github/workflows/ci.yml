name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never cancel a production deploy halfway through; PR runs can be cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  IMAGE_NAME: ativar-website

jobs:
  quality:
    name: Lint, typecheck, test, build
    # Self-hosted runner on the Ativar server (label: Ativar).
    runs-on: [self-hosted, Ativar]
    timeout-minutes: 20
    # Fork PRs would execute untrusted code on the server. Only run PRs from
    # branches of this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Keep CI builds away from the production .next directory.
          NEXT_DIST_DIR: .next-ci

  docker:
    name: Build and smoke-test image
    needs: quality
    runs-on: [self-hosted, Ativar]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag "${IMAGE_NAME}:ci-${GITHUB_RUN_ID}" .

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:ci-${GITHUB_RUN_ID}"
          name="ativar-ci-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker image rm -f "$image" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$name" "$image" >/dev/null
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$name")
            if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              break
            fi
            sleep 2
          done

          if [ "$status" != "healthy" ]; then
            echo "Container status: $status"
            docker logs --tail 80 "$name" || true
            exit 1
          fi

          docker exec "$name" node -e "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

  deploy:
    name: Deploy production
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Ativar]
    timeout-minutes: 20
    environment:
      name: production
      url: https://ativar.ir
    concurrency:
      group: ativar-production
      cancel-in-progress: false
    env:
      # Kept outside the repo: actions/checkout cleans the workspace on every run.
      APP_ENV_FILE: ${{ vars.ATIVAR_ENV_FILE || '/etc/ativar/ativar.env' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$APP_ENV_FILE" ]; then
            echo "::error::Env file '$APP_ENV_FILE' not found on the runner host. Create it from .env.example (see deploy/README.md)."
            exit 1
          fi
          ENV_FILE="$APP_ENV_FILE" bash deploy/deploy.sh

      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:4646/api/health
          echo
          echo "Deployment healthy on http://127.0.0.1:4646"
