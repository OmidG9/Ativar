<?xml version="1.0" encoding="UTF-8"?>
<!--
  ATIVAR — Persian islimi (اسلیمی) footer ornament.
  Vector only, brand palette only. Composition:
    · lachak (لچک) corner medallions with beaded arc bands
    · khatayi (ختایی) flowers in three sizes
    · palmettes (پالمت) riding islimi stems
    · spiralling tendrils and buds
    · a soft islimi band joining the four corners
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600"
     width="1600" height="600" preserveAspectRatio="xMidYMid slice"
     role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#21B5C8" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#12AFC1" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#176B9B" stop-opacity="0.32"/>
    </linearGradient>

    <linearGradient id="leaf" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#079BC5" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#176B9B" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#176B9B" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#21B5C8" stop-opacity="0.34"/>
    </linearGradient>

    <!-- soft ambience, fades fully to transparent (no hard disc edge) -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#21B5C8" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#12AFC1" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#176B9B" stop-opacity="0"/>
    </radialGradient>

    <!-- keeps medallion rings inside the corner quadrant -->
    <clipPath id="quad">
      <rect x="-560" y="0" width="560" height="470"/>
    </clipPath>

    <!-- Khatayi: rounded six-petal Persian flower -->
    <g id="khatayi">
      <g fill="url(#petal)">
        <path d="M0 0 C-7 -6 -12 -19 -10 -31 C-8.5 -41 8.5 -41 10 -31 C12 -19 7 -6 0 0 Z"/>
        <path d="M0 0 C-7 -6 -12 -19 -10 -31 C-8.5 -41 8.5 -41 10 -31 C12 -19 7 -6 0 0 Z" transform="rotate(60)"/>
        <path d="M0 0 C-7 -6 -12 -19 -10 -31 C-8.5 -41 8.5 -41 10 -31 C12 -19 7 -6 0 0 Z" transform="rotate(120)"/>
        <path d="M0 0 C-7 -6 -12 -19 -10 -31 C-8.5 -41 8.5 -41 10 -31 C12 -19 7 -6 0 0 Z" transform="rotate(180)"/>
        <path d="M0 0 C-7 -6 -12 -19 -10 -31 C-8.5 -41 8.5 -41 10 -31 C12 -19 7 -6 0 0 Z" transform="rotate(240)"/>
        <path d="M0 0 C-7 -6 -12 -19 -10 -31 C-8.5 -41 8.5 -41 10 -31 C12 -19 7 -6 0 0 Z" transform="rotate(300)"/>
      </g>
      <g fill="url(#petal)" opacity="0.78">
        <path d="M0 0 C-5 -5 -8 -13 -7 -22 C-6 -29 6 -29 7 -22 C8 -13 5 -5 0 0 Z" transform="rotate(30)"/>
        <path d="M0 0 C-5 -5 -8 -13 -7 -22 C-6 -29 6 -29 7 -22 C8 -13 5 -5 0 0 Z" transform="rotate(90)"/>
        <path d="M0 0 C-5 -5 -8 -13 -7 -22 C-6 -29 6 -29 7 -22 C8 -13 5 -5 0 0 Z" transform="rotate(150)"/>
        <path d="M0 0 C-5 -5 -8 -13 -7 -22 C-6 -29 6 -29 7 -22 C8 -13 5 -5 0 0 Z" transform="rotate(210)"/>
        <path d="M0 0 C-5 -5 -8 -13 -7 -22 C-6 -29 6 -29 7 -22 C8 -13 5 -5 0 0 Z" transform="rotate(270)"/>
        <path d="M0 0 C-5 -5 -8 -13 -7 -22 C-6 -29 6 -29 7 -22 C8 -13 5 -5 0 0 Z" transform="rotate(330)"/>
      </g>
      <!-- stamens -->
      <g fill="url(#petal)" opacity="0.85">
        <circle cx="0" cy="-13" r="1.5"/>
        <circle cx="11.3" cy="-6.5" r="1.5"/>
        <circle cx="11.3" cy="6.5" r="1.5"/>
        <circle cx="0" cy="13" r="1.5"/>
        <circle cx="-11.3" cy="6.5" r="1.5"/>
        <circle cx="-11.3" cy="-6.5" r="1.5"/>
      </g>
      <circle r="4.2" fill="url(#line)"/>
    </g>

    <!-- Palmette: fan leaf with raised centre vein -->
    <g id="palmette">
      <path d="M0 0 C-19 -15 -27 -41 -12 -61 C-6 -45 6 -45 12 -61 C27 -41 19 -15 0 0 Z"
            fill="url(#leaf)"/>
      <path d="M0 -6 C-3.5 -23 -2.5 -40 0 -52"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.45"
            stroke-width="1.2" stroke-linecap="round"/>
      <path d="M-7 -18 C-11 -28 -10 -38 -7 -45"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.25"
            stroke-width="0.9" stroke-linecap="round"/>
      <path d="M7 -18 C11 -28 10 -38 7 -45"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.25"
            stroke-width="0.9" stroke-linecap="round"/>
    </g>

    <!-- Islimi tendril: one sweeping curl with a rolled tip -->
    <g id="tendril">
      <path d="M0 0 C30 -6 56 -30 51 -57 C47 -78 22 -84 13 -69 C6 -58 13 -45 25 -47"
            fill="none" stroke="url(#line)" stroke-width="1.7"
            stroke-linecap="round"/>
    </g>

    <!-- Small diamond bud for the connecting band -->
    <g id="bud">
      <path d="M0 -9 C2.6 -3.4 3.4 -2.6 9 0 C3.4 2.6 2.6 3.4 0 9 C-2.6 3.4 -3.4 2.6 -9 0 C-3.4 -2.6 -2.6 -3.4 0 -9 Z"
            fill="url(#leaf)"/>
    </g>

    <!-- One corner assembly, drawn for the top-right corner (origin = corner) -->
    <g id="corner">
      <!-- lachak band: solid rings + beaded ring -->
      <g clip-path="url(#quad)" fill="none" stroke="url(#line)">
        <circle r="182" stroke-width="0.9" opacity="0.7"/>
        <circle r="171" stroke-width="7" stroke-dasharray="1.5 11"
                stroke-linecap="round" opacity="0.55"/>
        <circle r="152" stroke-width="1.4" opacity="0.9"/>
        <circle r="140" stroke-width="0.8" opacity="0.5"/>
      </g>

      <!-- corner rosette: quarter of a twelve-petal flower -->
      <g fill="url(#petal)" opacity="0.9">
        <path d="M0 0 C-5 -6 -8 -17 -7 -25 C-6 -33 6 -33 7 -25 C8 -17 5 -6 0 0 Z" transform="rotate(180)"/>
        <path d="M0 0 C-5 -6 -8 -17 -7 -25 C-6 -33 6 -33 7 -25 C8 -17 5 -6 0 0 Z" transform="rotate(195)"/>
        <path d="M0 0 C-5 -6 -8 -17 -7 -25 C-6 -33 6 -33 7 -25 C8 -17 5 -6 0 0 Z" transform="rotate(210)"/>
        <path d="M0 0 C-5 -6 -8 -17 -7 -25 C-6 -33 6 -33 7 -25 C8 -17 5 -6 0 0 Z" transform="rotate(225)"/>
        <path d="M0 0 C-5 -6 -8 -17 -7 -25 C-6 -33 6 -33 7 -25 C8 -17 5 -6 0 0 Z" transform="rotate(240)"/>
        <path d="M0 0 C-5 -6 -8 -17 -7 -25 C-6 -33 6 -33 7 -25 C8 -17 5 -6 0 0 Z" transform="rotate(255)"/>
        <path d="M0 0 C-5 -6 -8 -17 -7 -25 C-6 -33 6 -33 7 -25 C8 -17 5 -6 0 0 Z" transform="rotate(270)"/>
      </g>
      <circle r="9" fill="url(#leaf)"/>
      <circle r="4" fill="url(#line)" opacity="0.85"/>

      <!-- primary islimi stem -->
      <path d="M-58 62 C-132 104 -212 74 -272 132 C-316 174 -308 232 -246 250"
            fill="none" stroke="url(#line)" stroke-width="1.9" stroke-linecap="round"/>
      <!-- secondary stem -->
      <path d="M-44 122 C-100 162 -158 172 -214 214"
            fill="none" stroke="url(#line)" stroke-width="1.3"
            stroke-linecap="round" opacity="0.8"/>

      <!-- palmettes riding the stems -->
      <use href="#palmette" transform="translate(-160 92) rotate(238) scale(0.9)"/>
      <use href="#palmette" transform="translate(-268 168) rotate(218) scale(0.72)"/>
      <use href="#palmette" transform="translate(-104 142) rotate(252) scale(0.58)"/>
      <use href="#palmette" transform="translate(-204 202) rotate(230) scale(0.54)" opacity="0.85"/>

      <!-- khatayi flowers, three sizes -->
      <use href="#khatayi" transform="translate(-352 74) scale(0.92)"/>
      <use href="#khatayi" transform="translate(-196 226) scale(0.6)"/>
      <use href="#khatayi" transform="translate(-120 174) scale(0.42)" opacity="0.9"/>

      <!-- tendrils -->
      <use href="#tendril" transform="translate(-86 62) rotate(208) scale(0.85)"/>
      <use href="#tendril" transform="translate(-292 122) rotate(230) scale(0.68)"/>
      <use href="#tendril" transform="translate(-150 188) rotate(216) scale(0.56)"/>

      <!-- buds -->
      <g fill="url(#petal)">
        <circle cx="-418" cy="126" r="3.2"/>
        <circle cx="-388" cy="158" r="2.3"/>
        <circle cx="-126" cy="220" r="2.8"/>
        <circle cx="-78" cy="244" r="2"/>
      </g>
    </g>
  </defs>

  <!-- soft ambience -->
  <ellipse cx="1600" cy="0" rx="620" ry="430" fill="url(#glow)"/>
  <ellipse cx="0" cy="600" rx="620" ry="430" fill="url(#glow)"/>

  <!-- four mirrored corner assemblies -->
  <use href="#corner" transform="translate(1600 0)"/>
  <use href="#corner" transform="translate(0 0) scale(-1 1)"/>
  <use href="#corner" transform="translate(1600 600) scale(1 -1)"/>
  <use href="#corner" transform="translate(0 600) scale(-1 -1)"/>

  <!-- islimi band joining the corners -->
  <g fill="none" stroke="url(#line)" stroke-width="1.2" opacity="0.45"
     stroke-linecap="round">
    <path d="M470 22 C560 -4 646 44 736 20 C826 -4 906 44 996 20 C1064 2 1124 32 1184 18"/>
    <path d="M470 578 C560 604 646 556 736 580 C826 604 906 556 996 580 C1064 598 1124 568 1184 582"/>
  </g>
  <g opacity="0.4">
    <use href="#bud" transform="translate(596 20) rotate(196)"/>
    <use href="#bud" transform="translate(858 24) rotate(184) scale(0.85)"/>
    <use href="#bud" transform="translate(596 580) rotate(164)"/>
    <use href="#bud" transform="translate(858 576) rotate(176) scale(0.85)"/>
  </g>
  <g fill="url(#petal)" opacity="0.35">
    <circle cx="702" cy="12" r="2.6"/>
    <circle cx="960" cy="14" r="2.2"/>
    <circle cx="702" cy="588" r="2.6"/>
    <circle cx="960" cy="586" r="2.2"/>
  </g>

  <!-- central islimi column: keeps portrait / narrow crops from looking empty -->
  <g opacity="0.22">
    <path d="M800 -10 C782 52 822 104 800 168 C778 232 822 284 800 348 C778 412 822 464 800 528 C784 574 812 592 800 610"
          fill="none" stroke="url(#line)" stroke-width="1.3" stroke-linecap="round"/>
    <use href="#palmette" transform="translate(800 62) rotate(96) scale(0.4)"/>
    <use href="#palmette" transform="translate(800 212) rotate(264) scale(0.38)"/>
    <use href="#palmette" transform="translate(800 362) rotate(96) scale(0.4)"/>
    <use href="#palmette" transform="translate(800 512) rotate(264) scale(0.38)"/>
    <use href="#khatayi" transform="translate(800 136) scale(0.34)"/>
    <use href="#khatayi" transform="translate(800 436) scale(0.3)"/>
    <g fill="url(#petal)">
      <circle cx="800" cy="286" r="2.4"/>
      <circle cx="800" cy="302" r="1.7"/>
    </g>
  </g>
</svg>
