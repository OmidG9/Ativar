name: ativar

networks:
  ativar_net:
    driver: bridge

services:
  web:
    image: ativar-website:${TAG:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_ANALYTICS_SRC: ${NEXT_PUBLIC_ANALYTICS_SRC:-}
        NEXT_PUBLIC_ANALYTICS_DOMAIN: ${NEXT_PUBLIC_ANALYTICS_DOMAIN:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    container_name: ativar-web
    restart: unless-stopped
    networks:
      - ativar_net
    env_file:
      # Runtime secrets on the server outside the repo: /etc/ativar/ativar.env
      - path: ${APP_ENV_FILE:-/etc/ativar/ativar.env}
        required: false
    ports:
      - "127.0.0.1:4646:3000"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
