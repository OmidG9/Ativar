name: ativar

services:
  web:
    image: ativar-website:${TAG:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_ANALYTICS_SRC: ${NEXT_PUBLIC_ANALYTICS_SRC:-}
        NEXT_PUBLIC_ANALYTICS_DOMAIN: ${NEXT_PUBLIC_ANALYTICS_DOMAIN:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    container_name: ativar-web
    restart: unless-stopped
    env_file:
      # Runtime secrets (Telegram / Resend / webhook).
      # On the server keep this outside the repo, e.g. /etc/ativar/ativar.env,
      # so `actions/checkout` cannot clean it up.
      - path: ${APP_ENV_FILE:-.env.production}
        required: false
    ports:
      - "4646:3000"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
